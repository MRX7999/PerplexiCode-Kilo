<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" fill="none" aria-labelledby="wt-title wt-desc" role="img" viewBox="0 0 1600 700"><title id="wt-title">PerplexiCode Kilo worktree isolation flow</title><desc id="wt-desc">A task started with -w or the Worktree pill runs in a detached git worktree from HEAD. Escapes such as dot-dot paths, symlinks, git -C and git push are blocked. verify.command runs, then a result card shows the diff and status. Apply checks the patch and writes into your working copy without merge, commit or push; Discard removes the worktree. On a conflict nothing changes, the conflicting files are listed and the CLI exits with code 6.</desc><defs><pattern id="wt-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path stroke="#26344d" stroke-opacity=".26" d="M40 0H0V40"/></pattern><marker id="wt-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="6" refY="4"><path stroke="#5de2e7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 5 3-5 3"/></marker><marker id="wt-arrow2" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="6" refY="4"><path stroke="#a4a6ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 5 3-5 3"/></marker><marker id="wt-arrow3" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="6" refY="4"><path stroke="#f5b971" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 5 3-5 3"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif}.overline{font-size:24px;font-weight:600;letter-spacing:3px;fill:#9baac0}.title{font-size:44px;font-weight:650;letter-spacing:-1px;fill:#f3f7fc}.heading{font-size:28px;font-weight:600;fill:#f3f7fc}.body{font-size:24px;fill:#9baac0}.mono,.small{font-size:21px}.small{fill:#9baac0}.mono{font-family:&quot;SFMono-Regular&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace;fill:#5de2e7}.pill{font-size:20px;font-weight:650;letter-spacing:1px}</style></defs><rect width="1600" height="700" fill="#0b1020" rx="24"/><rect width="1598" height="698" x="1" y="1" stroke="#27344a" rx="23"/><rect width="1598" height="698" x="1" y="1" fill="url(#wt-grid)" rx="23"/><path stroke="#26344d" stroke-opacity=".55" d="M1030 1v134c0 29 23 52 52 52h518M1102 1v94c0 29 23 52 52 52h446"/><text x="56" y="62" class="overline">WORKFLOW / WORKTREE ISOLATION · 3.7</text><text x="56" y="120" class="title">Nothing lands in your checkout until you say so.</text><path stroke="#27344a" d="M56 152h1488"/><rect width="330" height="190" x="56" y="206" fill="#0e172b" stroke="#34465d" rx="14"/><circle cx="100" cy="254" r="18" fill="#16243a" stroke="#5de2e7" stroke-opacity=".7"/><text x="100" y="262" fill="#5de2e7" class="pill" text-anchor="middle">1</text><text x="134" y="264" class="heading">Task</text><text x="82" y="318" class="mono">pcode -w</text><text x="82" y="358" class="small">or the Worktree pill</text><path stroke="#5de2e7" stroke-width="2" marker-end="url(#wt-arrow)" d="M386 301h52"/><rect width="330" height="190" x="442" y="206" fill="#0e172b" stroke="#5de2e7" stroke-opacity=".65" stroke-width="1.5" rx="14"/><path stroke="#5de2e7" stroke-width="3" d="M460 206h294"/><circle cx="486" cy="254" r="18" fill="#16243a" stroke="#5de2e7" stroke-opacity=".7"/><text x="486" y="262" fill="#5de2e7" class="pill" text-anchor="middle">2</text><text x="520" y="264" class="heading">Isolated tree</text><text x="468" y="318" class="mono">detached from HEAD</text><text x="468" y="358" class="small">escapes and git push blocked</text><path stroke="#5de2e7" stroke-width="2" marker-end="url(#wt-arrow)" d="M772 301h52"/><rect width="330" height="190" x="828" y="206" fill="#0e172b" stroke="#34465d" rx="14"/><circle cx="872" cy="254" r="18" fill="#16243a" stroke="#5de2e7" stroke-opacity=".7"/><text x="872" y="262" fill="#5de2e7" class="pill" text-anchor="middle">3</text><text x="906" y="264" class="heading">verify</text><text x="854" y="318" class="mono">verify.command</text><text x="854" y="358" class="small">runs inside the tree</text><path stroke="#5de2e7" stroke-width="2" marker-end="url(#wt-arrow)" d="M1158 301h52"/><rect width="330" height="190" x="1214" y="206" fill="#0e172b" stroke="#34465d" rx="14"/><circle cx="1258" cy="254" r="18" fill="#16243a" stroke="#5de2e7" stroke-opacity=".7"/><text x="1258" y="262" fill="#5de2e7" class="pill" text-anchor="middle">4</text><text x="1292" y="264" class="heading">Result card</text><text x="1240" y="318" class="mono">files · diff · status</text><text x="1240" y="358" class="small">you decide</text><path stroke="#5de2e7" stroke-opacity=".7" stroke-width="1.5" d="M1379.0 396v60"/><path stroke="#5de2e7" stroke-opacity=".7" stroke-width="1.5" d="M294.66666666666663 456H1379.0"/><path stroke="#5de2e7" stroke-width="1.5" marker-end="url(#wt-arrow)" d="M294.66666666666663 456v16"/><rect width="477.333" height="168" x="56" y="476" fill="#103a40" stroke="#5de2e7" stroke-opacity=".55" rx="14"/><text x="84" y="526" class="heading" style="fill:#5de2e7">Apply</text><text x="84" y="568" class="body" style="fill:#d5deea">Patch checked, then written</text><text x="84" y="606" class="small">to your checkout · no commit or push</text><path stroke="#a4a6ff" stroke-opacity=".8" stroke-width="1.5" marker-end="url(#wt-arrow2)" d="M799.9999999999999 456v16"/><rect width="477.333" height="168" x="561.333" y="476" fill="#1c2240" stroke="#a4a6ff" stroke-opacity=".55" rx="14"/><text x="589.333" y="526" class="heading" style="fill:#a4a6ff">Discard</text><text x="589.333" y="568" class="body" style="fill:#d5deea">Worktree removed</text><text x="589.333" y="606" class="small">your checkout stays untouched</text><path stroke="#f5b971" stroke-opacity=".8" stroke-width="1.5" marker-end="url(#wt-arrow3)" d="M1305.3333333333333 456v16"/><rect width="477.333" height="168" x="1066.667" y="476" fill="#2a1d14" stroke="#f5b971" stroke-opacity=".55" rx="14"/><text x="1094.667" y="526" class="heading" style="fill:#f5b971">Conflict</text><text x="1094.667" y="568" class="body" style="fill:#d5deea">Apply stops, files listed</text><text x="1094.667" y="606" class="small">nothing changes · CLI exit code 6</text></svg>