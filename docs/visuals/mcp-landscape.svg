<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" fill="none" role="img" aria-labelledby="mcp-title mcp-desc">
  <title id="mcp-title">MCP catalog composition and installation behavior</title>
  <desc id="mcp-desc">The current catalog has 21 entries in five categories. Thirteen configuration templates comprise five development entries, three web entries, and five productivity entries. Eight manual setup guides comprise five security entries, Semgrep, Snyk, Ghidra, Shodan, and VirusTotal, and three pentest entries, Burp, ZAP, and Nmap. The proportional bar shows catalog counts, not usage. Installing a template saves configuration only; enabled configurations remain subject to trust, credentials, and tool permissions. A subsequent task may connect to a server and download packages or run local processes. Manual guides never auto-install. Security integrations and the Parrot VM were not runtime-tested. The catalog is not an audited package allowlist.</desc>
  <defs>
    <pattern id="mcp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#26344d" stroke-opacity=".24"/>
    </pattern>
    <marker id="mcp-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" stroke="#5de2e7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .overline { font-size:24px; font-weight:600; letter-spacing:3px; fill:#9baac0; }
      .title { font-size:44px; font-weight:650; letter-spacing:-1px; fill:#f3f7fc; }
      .heading { font-size:28px; font-weight:600; fill:#f3f7fc; }
      .body { font-size:24px; fill:#9baac0; }
      .label { font-size:24px; font-weight:550; fill:#f3f7fc; }
    </style>
  </defs>
  <rect width="1600" height="700" rx="24" fill="#0b1020"/>
  <rect x="1" y="1" width="1598" height="698" rx="23" stroke="#27344a"/>
  <rect x="1" y="1" width="1598" height="698" rx="23" fill="url(#mcp-grid)"/>
  <text x="56" y="60" class="overline">MCP / CATALOG COMPOSITION</text>
  <text x="56" y="116" class="title">One catalog. Two setup paths.</text>
  <text x="1364" y="100" font-size="64" font-weight="650" letter-spacing="-2" fill="#f3f7fc">21</text>
  <text x="1445" y="96" class="body">entries</text>
  <text x="1364" y="130" class="body">5 categories</text>

  <path d="M56 151h1488" stroke="#27344a"/>
  <text x="56" y="191" font-size="24" font-weight="600" fill="#5de2e7">13 configuration templates</text>
  <text x="989" y="191" font-size="24" font-weight="600" fill="#eecb86">8 manual setup guides</text>
  <text x="597" y="191" class="body">Catalog counts, not usage</text>

  <!-- Each category occupies its exact share of 21 entries. -->
