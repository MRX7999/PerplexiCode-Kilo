<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" fill="none" aria-labelledby="remote-title remote-desc" role="img" viewBox="0 0 1600 800"><title id="remote-title">PerplexiCode Kilo 4.0 remote core</title><desc id="remote-desc">The IDE machine keeps the Perplexity session and the serve token. It connects to pcode serve on a build box over a 0600 Unix socket or a WebSocket with a bearer token, optionally through an SSH tunnel. Tasks and tool events flow to the daemon; every model request comes back to the IDE through llm/complete and goes to Perplexity from there. Cookies and CSRF or session tokens never cross the wire.</desc><defs><pattern id="remote-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path stroke="#26344d" stroke-opacity=".26" d="M40 0H0V40"/></pattern><marker id="remote-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="6" refY="4"><path stroke="#5de2e7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 5 3-5 3"/></marker><marker id="remote-arrow2" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="6" refY="4"><path stroke="#a4a6ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 5 3-5 3"/></marker><marker id="remote-arrow3" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="6" refY="4"><path stroke="#f5b971" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 5 3-5 3"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif}.overline{font-size:24px;font-weight:600;letter-spacing:3px;fill:#9baac0}.title{font-size:44px;font-weight:650;letter-spacing:-1px;fill:#f3f7fc}.heading{font-size:28px;font-weight:600;fill:#f3f7fc}.body,.small{font-size:24px;fill:#9baac0}.small{font-size:21px}.label{font-size:24px;font-weight:550;fill:#f3f7fc}.mono{font-family:&quot;SFMono-Regular&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace;font-size:21px;fill:#5de2e7}</style></defs><rect width="1600" height="800" fill="#0b1020" rx="24"/><rect width="1598" height="798" x="1" y="1" stroke="#27344a" rx="23"/><rect width="1598" height="798" x="1" y="1" fill="url(#remote-grid)" rx="23"/><path stroke="#26344d" stroke-opacity=".55" d="M1030 1v134c0 29 23 52 52 52h518M1102 1v94c0 29 23 52 52 52h446"/><text x="56" y="62" class="overline">SYSTEM / REMOTE CORE · 4.0</text><text x="56" y="120" class="title">Run the core anywhere. Keep the session home.</text><path stroke="#27344a" d="M56 152h1488"/><text x="56" y="195" class="overline">YOUR MACHINE</text><text x="680" y="195" class="overline">CHANNEL</text><text x="1016" y="195" class="overline">BUILD BOX · VM · CONTAINER</text><rect width="580" height="420" x="56" y="220" fill="#0e172b" stroke="#a4a6ff" stroke-opacity=".6" stroke-width="1.5" rx="16"/><path stroke="#a4a6ff" stroke-width="3" d="M78 220h536"/><path stroke="#a4a6ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M85 247h36v26H85zM96 273v9m-7 0h25"/><text x="138" y="276" class="heading">IDE · PerplexiCode client</text><text x="84" y="316" class="body">VS Code or Antigravity</text><rect width="524" height="122" x="84" y="344" fill="#1c2240" stroke="#555b90" rx="10"/><rect width="22" height="18" x="108" y="374" stroke="#a4a6ff" stroke-width="2.2" rx="3"/><path stroke="#a4a6ff" stroke-width="2.2" d="M112 374v-6a7 7 0 0 1 14 0v6"/><text x="146" y="391" class="label">Perplexity session</text><text x="108" y="428" class="small">cookies · CSRF · account rotation</text><text x="108" y="454" class="small" style="fill:#a4a6ff">never leaves this machine</text><rect width="252" height="128" x="84" y="482" fill="#131e33" stroke="#30415a" rx="10"/><text x="108" y="520" class="label">SecretStorage</text><text x="108" y="556" class="small">serve token</text><text x="108" y="586" class="small">remote.url</text><rect width="252" height="128" x="356" y="482" fill="#131e33" stroke="#30415a" rx="10"/><text x="380" y="520" class="label">Chat &amp; diffs</text><text x="380" y="556" class="small">approvals stay</text><text x="380" y="586" class="small">in your editor</text><rect width="580" height="72" x="56" y="664" fill="#121a32" stroke="#555b90" rx="12"/><circle cx="86" cy="700" r="6" fill="#a4a6ff"/><text x="106" y="708" class="label">Perplexity · your Pro / Max account</text><path stroke="#a4a6ff" stroke-width="2" marker-end="url(#remote-arrow2)" marker-start="url(#remote-arrow2)" d="M346 610v54"/><rect width="292" height="420" x="680" y="220" fill="#0b1426" stroke="#34465d" stroke-dasharray="6 6" rx="16"/><text x="706" y="266" class="label">Unix socket</text><text x="706" y="296" class="mono">serve.sock · 0600</text><path stroke="#2c3b53" d="M706 318h240"/><text x="706" y="356" class="label">WebSocket</text><text x="706" y="386" class="mono">127.0.0.1 · bearer</text><path stroke="#2c3b53" d="M706 408h240"/><text x="706" y="446" class="label">SSH tunnel</text><text x="706" y="476" class="mono">ssh -L 4190:…</text><path stroke="#2c3b53" d="M706 498h240"/><text x="706" y="538" class="small" style="fill:#5de2e7">→ tasks, approvals</text><text x="706" y="572" class="small" style="fill:#a4a6ff">← llm/complete</text><text x="706" y="606" class="small">← tool events, diffs</text><path stroke="#5de2e7" stroke-width="2" marker-end="url(#remote-arrow)" d="M636 300h44"/><path stroke="#5de2e7" stroke-width="2" marker-end="url(#remote-arrow)" d="M972 300h44"/><path stroke="#a4a6ff" stroke-width="2" marker-end="url(#remote-arrow2)" d="M1016 560h-44"/><path stroke="#a4a6ff" stroke-width="2" marker-end="url(#remote-arrow2)" d="M680 560h-44"/><rect width="528" height="516" x="1016" y="220" fill="#0e172b" stroke="#5de2e7" stroke-opacity=".65" stroke-width="1.5" rx="16"/><path stroke="#5de2e7" stroke-width="3" d="M1038 220h484"/><path stroke="#5de2e7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="m1046 248 10 10-10 10m18 0h16"/><text x="1098" y="276" class="heading">pcode serve</text><text x="1044" y="316" class="body">Shared agent core, headless</text><rect width="228" height="122" x="1044" y="344" fill="#16243a" stroke="#35566b" rx="10"/><text x="1064" y="390" class="label" style="font-size:23px">Files · shell · git</text><text x="1064" y="428" class="small">on the build box</text><rect width="228" height="122" x="1288" y="344" fill="#16243a" stroke="#35566b" rx="10"/><text x="1308" y="390" class="label" style="font-size:23px">LSP servers</text><text x="1308" y="428" class="small">from .lsp.json</text><rect width="228" height="122" x="1044" y="482" fill="#16243a" stroke="#35566b" rx="10"/><text x="1064" y="528" class="label" style="font-size:23px">Worktrees</text><text x="1064" y="566" class="small">isolated tasks</text><rect width="228" height="122" x="1288" y="482" fill="#16243a" stroke="#35566b" rx="10"/><text x="1308" y="528" class="label" style="font-size:23px">Hooks · MCP</text><text x="1308" y="566" class="small">trusted folders only</text><rect width="472" height="82" x="1044" y="626" fill="#2a1d14" stroke="#7a5a35" rx="10"/><path stroke="#f5b971" stroke-linejoin="round" stroke-width="2.2" d="M1068 652l10 -16 10 16z"/><text x="1102" y="656" class="label" style="font-size:22px;fill:#f5b971">No cookies accepted</text><text x="1068" y="690" class="small">session fields are rejected and logged</text></svg>