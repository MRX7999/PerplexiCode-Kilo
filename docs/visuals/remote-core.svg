<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" fill="none" role="img" aria-labelledby="remote-title remote-desc">
  <title id="remote-title">PerplexiCode Kilo 4.0 remote core</title>
  <desc id="remote-desc">The IDE machine keeps the Perplexity session and the serve token. It connects to pcode serve on a build box over a 0600 Unix socket or a WebSocket with a bearer token, optionally through an SSH tunnel. Tasks and tool events flow to the daemon; every model request comes back to the IDE through llm/complete and goes to Perplexity from there. Cookies and CSRF or session tokens never cross the wire.</desc>
  <defs>
    <pattern id="remote-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#26344d" stroke-opacity=".26"/>
    </pattern>
    <marker id="remote-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" stroke="#5de2e7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="remote-arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" stroke="#a4a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="remote-arrow3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" stroke="#f5b971" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .overline { font-size:24px; font-weight:600; letter-spacing:3px; fill:#9baac0; }
      .title { font-size:44px; font-weight:650; letter-spacing:-1px; fill:#f3f7fc; }
      .heading { font-size:28px; font-weight:600; fill:#f3f7fc; }
      .body { font-size:24px; fill:#9baac0; }
      .small { font-size:21px; fill:#9baac0; }
      .label { font-size:24px; font-weight:550; fill:#f3f7fc; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size:21px; fill:#5de2e7; }
      .pill { font-size:20px; font-weight:650; letter-spacing:1px; }
      .big { font-size:52px; font-weight:700; letter-spacing:-1px; fill:#5de2e7; }
    </style>
  </defs>
  <rect width="1600" height="800" rx="24" fill="#0b1020"/>
  <rect x="1" y="1" width="1598" height="798" rx="23" stroke="#27344a"/>
  <rect x="1" y="1" width="1598" height="798" rx="23" fill="url(#remote-grid)"/>
  <path d="M1030 1v134c0 29 23 52 52 52h518M1102 1v94c0 29 23 52 52 52h446" stroke="#26344d" stroke-opacity=".55"/>
  <text x="56" y="62" class="overline">SYSTEM / REMOTE CORE · 4.0</text>
  <text x="56" y="120" class="title">Run the core anywhere. Keep the session home.</text>
  <path d="M56 152h1488" stroke="#27344a"/>
  <text x="56" y="195" class="overline">YOUR MACHINE</text>
  <text x="680" y="195" class="overline">CHANNEL</text>
  <text x="1016" y="195" class="overline">BUILD BOX · VM · CONTAINER</text>

  <!-- IDE machine -->
  <rect x="56" y="220" width="580" height="420" rx="16" fill="#0e172b" stroke="#a4a6ff" stroke-opacity=".6" stroke-width="1.5"/>
  <path d="M78 220h536" stroke="#a4a6ff" stroke-width="3"/>
  <path d="M85 247h36v26H85zM96 273v9m-7 0h25" stroke="#a4a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="138" y="276" class="heading">IDE · PerplexiCode client</text>
  <text x="84" y="316" class="body">VS Code or Antigravity</text>

  <rect x="84" y="344" width="524" height="122" rx="10" fill="#1c2240" stroke="#555b90"/>
  <rect x="108" y="374" width="22" height="18" rx="3" stroke="#a4a6ff" stroke-width="2.2"/>
  <path d="M112 374v-6a7 7 0 0 1 14 0v6" stroke="#a4a6ff" stroke-width="2.2"/>
  <text x="146" y="391" class="label">Perplexity session</text>
  <text x="108" y="428" class="small">cookies · CSRF · account rotation</text>
  <text x="108" y="454" class="small" style="fill:#a4a6ff">never leaves this machine</text>

  <rect x="84" y="482" width="252" height="128" rx="10" fill="#131e33" stroke="#30415a"/>
  <text x="108" y="520" class="label">SecretStorage</text>
  <text x="108" y="556" class="small">serve token</text>
  <text x="108" y="586" class="small">remote.url</text>
  <rect x="356" y="482" width="252" height="128" rx="10" fill="#131e33" stroke="#30415a"/>
  <text x="380" y="520" class="label">Chat &amp; diffs</text>
  <text x="380" y="556" class="small">approvals stay</text>
  <text x="380" y="586" class="small">in your editor</text>

  <!-- Perplexity -->
  <rect x="56" y="664" width="580" height="72" rx="12" fill="#121a32" stroke="#555b90"/>
  <circle cx="86" cy="700" r="6" fill="#a4a6ff"/>
  <text x="106" y="708" class="label">Perplexity · your Pro / Max account</text>
  <path d="M346 610v54" stroke="#a4a6ff" stroke-width="2" marker-start="url(#remote-arrow2)" marker-end="url(#remote-arrow2)"/>

  <!-- channel -->
  <rect x="680" y="220" width="292" height="420" rx="16" fill="#0b1426" stroke="#34465d" stroke-dasharray="6 6"/>
  <text x="706" y="266" class="label">Unix socket</text>
  <text x="706" y="296" class="mono">serve.sock · 0600</text>
  <path d="M706 318h240" stroke="#2c3b53"/>
  <text x="706" y="356" class="label">WebSocket</text>
  <text x="706" y="386" class="mono">127.0.0.1 · bearer</text>
  <path d="M706 408h240" stroke="#2c3b53"/>
  <text x="706" y="446" class="label">SSH tunnel</text>
  <text x="706" y="476" class="mono">ssh -L 4190:…</text>
  <path d="M706 498h240" stroke="#2c3b53"/>
  <text x="706" y="538" class="small" style="fill:#5de2e7">→ tasks, approvals</text>
  <text x="706" y="572" class="small" style="fill:#a4a6ff">← llm/complete</text>
  <text x="706" y="606" class="small">← tool events, diffs</text>

  <path d="M636 300h44" stroke="#5de2e7" stroke-width="2" marker-end="url(#remote-arrow)"/>
  <path d="M972 300h44" stroke="#5de2e7" stroke-width="2" marker-end="url(#remote-arrow)"/>
  <path d="M1016 560h-44" stroke="#a4a6ff" stroke-width="2" marker-end="url(#remote-arrow2)"/>
  <path d="M680 560h-44" stroke="#a4a6ff" stroke-width="2" marker-end="url(#remote-arrow2)"/>

  <!-- daemon -->
  <rect x="1016" y="220" width="528" height="516" rx="16" fill="#0e172b" stroke="#5de2e7" stroke-opacity=".65" stroke-width="1.5"/>
  <path d="M1038 220h484" stroke="#5de2e7" stroke-width="3"/>
  <path d="m1046 248 10 10-10 10m18 0h16" stroke="#5de2e7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1098" y="276" class="heading">pcode serve</text>
  <text x="1044" y="316" class="body">Shared agent core, headless</text>
  <rect x="1044" y="344" width="228" height="122" rx="10" fill="#16243a" stroke="#35566b"/>
  <text x="1064" y="390" class="label" style="font-size:23px">Files · shell · git</text>
  <text x="1064" y="428" class="small">on the build box</text>
  <rect x="1288" y="344" width="228" height="122" rx="10" fill="#16243a" stroke="#35566b"/>
  <text x="1308" y="390" class="label" style="font-size:23px">LSP servers</text>
  <text x="1308" y="428" class="small">from .lsp.json</text>
  <rect x="1044" y="482" width="228" height="122" rx="10" fill="#16243a" stroke="#35566b"/>
  <text x="1064" y="528" class="label" style="font-size:23px">Worktrees</text>
  <text x="1064" y="566" class="small">isolated tasks</text>
  <rect x="1288" y="482" width="228" height="122" rx="10" fill="#16243a" stroke="#35566b"/>
  <text x="1308" y="528" class="label" style="font-size:23px">Hooks · MCP</text>
  <text x="1308" y="566" class="small">trusted folders only</text>
  <rect x="1044" y="626" width="472" height="82" rx="10" fill="#2a1d14" stroke="#7a5a35"/>
  <path d="M1068 652l10 -16 10 16z" stroke="#f5b971" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="1102" y="656" class="label" style="font-size:22px;fill:#f5b971">No cookies accepted</text>
  <text x="1068" y="690" class="small">session fields are rejected and logged</text>
</svg>
