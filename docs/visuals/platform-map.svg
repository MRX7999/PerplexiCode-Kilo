  <text x="1148" y="589" class="body">stdio or HTTP transport</text>

  <rect x="56" y="654" width="1488" height="58" rx="10" fill="#111c30" stroke="#30415a"/>
  <path d="M78 673v20m0 5v1" stroke="#9baac0" stroke-width="2.5" stroke-linecap="round"/>
  <text x="104" y="690" class="body">Functional relationships, not deployment isolation. Local tools and hooks run with host access.</text>
</svg>
