<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" fill="none" role="img" aria-labelledby="platform-title platform-desc">
  <title id="platform-title">PerplexiCode Kilo functional platform map</title>
  <desc id="platform-desc">The IDE and terminal use a shared agent loop, with context, model requests, and tool actions. Agent modes, permissions, hooks, and verification govern the workflow. The loop communicates with a Perplexity session or an OpenAI-compatible provider, including local endpoints, and uses workspace files, shell and web tools, and MCP servers over stdio or HTTP. This is a functional map, not a deployment or isolation diagram. Local tools and hooks run with host access.</desc>
  <defs>
    <pattern id="platform-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#26344d" stroke-opacity=".26"/>
    </pattern>
    <marker id="platform-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" stroke="#5de2e7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="platform-model-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" stroke="#a4a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .overline { font-size:24px; font-weight:600; letter-spacing:3px; fill:#9baac0; }
      .title { font-size:44px; font-weight:650; letter-spacing:-1px; fill:#f3f7fc; }
      .heading { font-size:28px; font-weight:600; fill:#f3f7fc; }
      .body { font-size:24px; fill:#9baac0; }
      .label { font-size:24px; font-weight:550; fill:#f3f7fc; }
    </style>
  </defs>
  <rect width="1600" height="760" rx="24" fill="#0b1020"/>
  <rect x="1" y="1" width="1598" height="758" rx="23" stroke="#27344a"/>
  <rect x="1" y="1" width="1598" height="758" rx="23" fill="url(#platform-grid)"/>
  <path d="M1030 1v134c0 29 23 52 52 52h518M1102 1v94c0 29 23 52 52 52h446" stroke="#26344d" stroke-opacity=".55"/>

  <text x="56" y="62" class="overline">SYSTEM / FUNCTIONAL MAP</text>
  <text x="56" y="120" class="title">One core, two ways to work.</text>
  <path d="M56 152h1488" stroke="#27344a"/>
  <text x="56" y="195" class="overline">ENTRY POINTS</text>
  <text x="444" y="195" class="overline">SHARED WORKFLOW</text>
  <text x="1120" y="195" class="overline">CONNECTED CAPABILITIES</text>

  <rect x="56" y="220" width="300" height="164" rx="14" fill="#0e172b" stroke="#34465d"/>
  <path d="M85 247h36v26H85zM96 273v9m-7 0h25" stroke="#5de2e7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="138" y="276" class="heading">IDE</text>
  <text x="84" y="324" class="body">VS Code</text>
  <text x="84" y="356" class="body">+ Antigravity</text>

  <rect x="56" y="420" width="300" height="164" rx="14" fill="#0e172b" stroke="#34465d"/>
  <path d="m86 448 10 10-10 10m18 0h16" stroke="#5de2e7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="138" y="476" class="heading">Terminal</text>
  <text x="84" y="524" class="body">Interactive CLI</text>
  <text x="84" y="556" class="body">+ headless runs</text>

