  <rect x="760" y="534" width="252" height="52" rx="8" fill="#131e33" stroke="#30415a"/>
  <text x="784" y="568" class="label">Verification</text>

  <path d="M1044 302h76" stroke="#a4a6ff" stroke-width="2" marker-start="url(#platform-model-arrow)" marker-end="url(#platform-model-arrow)"/>
  <rect x="1120" y="220" width="424" height="176" rx="14" fill="#121a32" stroke="#555b90"/>
  <circle cx="1149" cy="251" r="5" fill="#a4a6ff"/>
  <text x="1168" y="268" class="heading">Providers</text>
  <text x="1148" y="310" class="body">Perplexity session</text>
  <text x="1148" y="344" class="body">OpenAI-compatible</text>
  <text x="1148" y="376" class="body">including local endpoints</text>

  <path d="M1044 518h76" stroke="#5de2e7" stroke-width="2" marker-start="url(#platform-arrow)" marker-end="url(#platform-arrow)"/>
  <rect x="1120" y="420" width="424" height="196" rx="14" fill="#0e172b" stroke="#34465d"/>
  <text x="1148" y="463" class="heading">Workspace + tools</text>
  <text x="1148" y="500" class="body">Files · shell · web</text>
  <path d="M1148 519h368" stroke="#2c3b53"/>
