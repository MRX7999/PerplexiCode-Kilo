<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" fill="none" aria-labelledby="platform-title platform-desc" role="img" viewBox="0 0 1600 760"><title id="platform-title">PerplexiCode Kilo functional platform map</title><desc id="platform-desc">The IDE and terminal use a shared agent loop, with context, model requests, and tool actions. Agent modes, permissions, hooks, and verification govern the workflow. The loop communicates with a Perplexity session or an OpenAI-compatible provider, including local endpoints, and uses workspace files, shell and web tools, and MCP servers over stdio or HTTP. This is a functional map, not a deployment or isolation diagram. Local tools and hooks run with host access.</desc><defs><pattern id="platform-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path stroke="#26344d" stroke-opacity=".26" d="M40 0H0V40"/></pattern><marker id="platform-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="6" refY="4"><path stroke="#5de2e7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 5 3-5 3"/></marker><marker id="platform-model-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="6" refY="4"><path stroke="#a4a6ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 5 3-5 3"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif}.overline{font-size:24px;font-weight:600;letter-spacing:3px;fill:#9baac0}.title{font-size:44px;font-weight:650;letter-spacing:-1px;fill:#f3f7fc}.heading{font-size:28px;font-weight:600;fill:#f3f7fc}.body,.label{font-size:24px;fill:#9baac0}.label{font-weight:550;fill:#f3f7fc}</style></defs><rect width="1600" height="760" fill="#0b1020" rx="24"/><rect width="1598" height="758" x="1" y="1" stroke="#27344a" rx="23"/><rect width="1598" height="758" x="1" y="1" fill="url(#platform-grid)" rx="23"/><path stroke="#26344d" stroke-opacity=".55" d="M1030 1v134c0 29 23 52 52 52h518M1102 1v94c0 29 23 52 52 52h446"/><text x="56" y="62" class="overline">SYSTEM / FUNCTIONAL MAP</text><text x="56" y="120" class="title">One core, two ways to work.</text><path stroke="#27344a" d="M56 152h1488"/><text x="56" y="195" class="overline">ENTRY POINTS</text><text x="444" y="195" class="overline">SHARED WORKFLOW</text><text x="1120" y="195" class="overline">CONNECTED CAPABILITIES</text><rect width="300" height="164" x="56" y="220" fill="#0e172b" stroke="#34465d" rx="14"/><path stroke="#5de2e7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M85 247h36v26H85zM96 273v9m-7 0h25"/><text x="138" y="276" class="heading">IDE</text><text x="84" y="324" class="body">VS Code</text><text x="84" y="356" class="body">+ Antigravity</text><rect width="300" height="164" x="56" y="420" fill="#0e172b" stroke="#34465d" rx="14"/><path stroke="#5de2e7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="m86 448 10 10-10 10m18 0h16"/><text x="138" y="476" class="heading">Terminal</text><text x="84" y="524" class="body">Interactive CLI</text><text x="84" y="556" class="body">+ headless runs</text><path stroke="#5de2e7" stroke-width="2" marker-end="url(#platform-arrow)" d="M356 302h38a16 16 0 0 1 16 16v76a16 16 0 0 0 16 16h18M356 502h38a16 16 0 0 0 16-16v-60a16 16 0 0 1 16-16h18"/><circle cx="410" cy="410" r="5" fill="#5de2e7"/><rect width="600" height="396" x="444" y="220" fill="#0e172b" stroke="#5de2e7" stroke-opacity=".65" stroke-width="1.5" rx="16"/><path stroke="#5de2e7" stroke-width="3" d="M466 220h556"/><text x="476" y="268" class="heading">Shared agent loop</text><text x="476" y="306" class="body">One task engine across both interfaces</text><rect width="156" height="62" x="476" y="336" fill="#16243a" stroke="#35566b" rx="9"/><text x="554" y="375" class="label" text-anchor="middle">Context</text><rect width="156" height="62" x="666" y="336" fill="#1c2240" stroke="#555b90" rx="9"/><text x="744" y="375" class="label" text-anchor="middle">Model</text><rect width="156" height="62" x="856" y="336" fill="#16243a" stroke="#35566b" rx="9"/><text x="934" y="375" class="label" text-anchor="middle">Actions</text><path stroke="#5de2e7" stroke-width="2" marker-end="url(#platform-arrow)" d="M632 367h27m163 0h27"/><path stroke="#5de2e7" stroke-opacity=".7" stroke-width="1.5" marker-end="url(#platform-arrow)" d="M934 398v12a12 12 0 0 1-12 12H566a12 12 0 0 1-12-12v-12"/><path stroke="#2c3b53" d="M476 446h536"/><rect width="252" height="52" x="476" y="466" fill="#131e33" stroke="#30415a" rx="8"/><text x="500" y="500" class="label">Agent modes</text><rect width="252" height="52" x="760" y="466" fill="#131e33" stroke="#30415a" rx="8"/><text x="784" y="500" class="label">Permissions</text><rect width="252" height="52" x="476" y="534" fill="#131e33" stroke="#30415a" rx="8"/><text x="500" y="568" class="label">Hooks</text><rect width="252" height="52" x="760" y="534" fill="#131e33" stroke="#30415a" rx="8"/><text x="784" y="568" class="label">Verification</text><path stroke="#a4a6ff" stroke-width="2" marker-end="url(#platform-model-arrow)" marker-start="url(#platform-model-arrow)" d="M1044 302h76"/><rect width="424" height="176" x="1120" y="220" fill="#121a32" stroke="#555b90" rx="14"/><circle cx="1149" cy="251" r="5" fill="#a4a6ff"/><text x="1168" y="268" class="heading">Providers</text><text x="1148" y="310" class="body">Perplexity session</text><text x="1148" y="344" class="body">OpenAI-compatible</text><text x="1148" y="376" class="body">including local endpoints</text><path stroke="#5de2e7" stroke-width="2" marker-end="url(#platform-arrow)" marker-start="url(#platform-arrow)" d="M1044 518h76"/><rect width="424" height="196" x="1120" y="420" fill="#0e172b" stroke="#34465d" rx="14"/><text x="1148" y="463" class="heading">Workspace + tools</text><text x="1148" y="500" class="body">Files · shell · web</text><path stroke="#2c3b53" d="M1148 519h368"/><text x="1148" y="553" class="heading">MCP servers</text><text x="1148" y="589" class="body">stdio or HTTP transport</text><rect width="1488" height="58" x="56" y="654" fill="#111c30" stroke="#30415a" rx="10"/><path stroke="#9baac0" stroke-linecap="round" stroke-width="2.5" d="M78 673v20m0 5v1"/><text x="104" y="690" class="body">Functional relationships, not deployment isolation. Local tools and hooks run with host access.</text></svg>