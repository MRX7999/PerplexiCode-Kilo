  <circle cx="410" cy="410" r="5" fill="#5de2e7"/>

  <rect x="444" y="220" width="600" height="396" rx="16" fill="#0e172b" stroke="#5de2e7" stroke-opacity=".65" stroke-width="1.5"/>
  <path d="M466 220h556" stroke="#5de2e7" stroke-width="3"/>
  <text x="476" y="268" class="heading">Shared agent loop</text>
  <text x="476" y="306" class="body">One task engine across both interfaces</text>

