  <rect x="476" y="466" width="252" height="52" rx="8" fill="#131e33" stroke="#30415a"/>
  <text x="500" y="500" class="label">Agent modes</text>
  <rect x="760" y="466" width="252" height="52" rx="8" fill="#131e33" stroke="#30415a"/>
  <text x="784" y="500" class="label">Permissions</text>
  <rect x="476" y="534" width="252" height="52" rx="8" fill="#131e33" stroke="#30415a"/>
