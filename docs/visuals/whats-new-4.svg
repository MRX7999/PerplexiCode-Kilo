<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" fill="none" role="img" aria-labelledby="release-title release-desc">
  <title id="release-title">PerplexiCode Kilo road to 4.0</title>
  <desc id="release-desc">Five releases from 3.4 to 4.0: 3.5 reliability and security hardening, 3.6 context intelligence, 3.7 worktree isolation, 3.8 MCP OAuth and review, 4.0 remote core, LSP, REPL and Quick Edit. Key results: 77 percent fewer read_file calls before the first edit, 63 percent smaller prompts with the repo map, 133 models in the 2026-11-27 snapshot, zero renamed settings.</desc>
