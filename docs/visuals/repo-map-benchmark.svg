<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" fill="none" aria-labelledby="bench-title bench-desc" role="img" viewBox="0 0 1600 740"><title id="bench-title">@repo map benchmark, 3.4 baseline versus 3.6</title><desc id="bench-desc">On a reproducible 24-task bug-fix benchmark, read_file calls before the first valid edit dropped from 4.29 to 1.00 (minus 76.7 percent), prompt characters dropped from 150,858 to 55,347 (minus 63.3 percent), and the verify pass rate stayed at 100 percent.</desc><defs><pattern id="bench-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path stroke="#26344d" stroke-opacity=".26" d="M40 0H0V40"/></pattern><marker id="bench-arrow" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="6" refY="4"><path stroke="#5de2e7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 5 3-5 3"/></marker><marker id="bench-arrow2" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="6" refY="4"><path stroke="#a4a6ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 5 3-5 3"/></marker><marker id="bench-arrow3" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="6" refY="4"><path stroke="#f5b971" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 5 3-5 3"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Arial,sans-serif}.overline{font-size:24px;font-weight:600;letter-spacing:3px;fill:#9baac0}.title{font-size:44px;font-weight:650;letter-spacing:-1px;fill:#f3f7fc}.heading{font-size:28px;font-weight:600;fill:#f3f7fc}.body,.small{font-size:24px;fill:#9baac0}.small{font-size:21px}.label{font-size:24px;font-weight:550;fill:#f3f7fc}.pill{font-size:20px;font-weight:650;letter-spacing:1px}</style></defs><rect width="1600" height="740" fill="#0b1020" rx="24"/><rect width="1598" height="738" x="1" y="1" stroke="#27344a" rx="23"/><rect width="1598" height="738" x="1" y="1" fill="url(#bench-grid)" rx="23"/><path stroke="#26344d" stroke-opacity=".55" d="M1030 1v134c0 29 23 52 52 52h518M1102 1v94c0 29 23 52 52 52h446"/><text x="56" y="62" class="overline">BENCHMARK / @REPO MAP · 3.6</text><text x="56" y="120" class="title">Less searching. Same passing tests.</text><path stroke="#27344a" d="M56 152h1488"/><rect width="22" height="22" x="1140" y="180" fill="#3a4660" rx="5"/><text x="1174" y="199" class="small">3.4 baseline</text><rect width="22" height="22" x="1330" y="180" fill="#5de2e7" rx="5"/><text x="1364" y="199" class="small">3.6 with @repo</text><text x="56" y="270" class="heading">read_file calls</text><text x="56" y="308" class="body">before the first edit</text><rect width="780" height="36" x="480" y="242" fill="#3a4660" rx="8"/><text x="1276" y="269" class="label" style="fill:#9baac0">4.29</text><rect width="181.818" height="36" x="480" y="290" fill="#5de2e7" rx="8"/><text x="677.818" y="317" class="label">1.00</text><rect width="124" height="44" x="1420" y="262" fill="#111c30" stroke="#5de2e7" stroke-opacity=".6" rx="22"/><text x="1482" y="292" fill="#5de2e7" class="pill" text-anchor="middle" style="font-size:22px">−76.7%</text><path stroke="#1f2b40" d="M56 354h1488"/><text x="56" y="410" class="heading">Prompt characters</text><text x="56" y="448" class="body">sent per task</text><rect width="780" height="36" x="480" y="382" fill="#3a4660" rx="8"/><text x="1276" y="409" class="label" style="fill:#9baac0">150,858</text><rect width="286.168" height="36" x="480" y="430" fill="#5de2e7" rx="8"/><text x="782.168" y="457" class="label">55,347</text><rect width="124" height="44" x="1420" y="402" fill="#111c30" stroke="#5de2e7" stroke-opacity=".6" rx="22"/><text x="1482" y="432" fill="#5de2e7" class="pill" text-anchor="middle" style="font-size:22px">−63.3%</text><path stroke="#1f2b40" d="M56 494h1488"/><text x="56" y="550" class="heading">verify pass rate</text><text x="56" y="588" class="body">24 of 24 tasks</text><rect width="780" height="36" x="480" y="522" fill="#3a4660" rx="8"/><text x="1276" y="549" class="label" style="fill:#9baac0">100%</text><rect width="780" height="36" x="480" y="570" fill="#5de2e7" rx="8"/><text x="1276" y="597" class="label">100%</text><rect width="124" height="44" x="1420" y="542" fill="#111c30" stroke="#a4a6ff" stroke-opacity=".6" rx="22"/><text x="1482" y="572" fill="#a4a6ff" class="pill" text-anchor="middle" style="font-size:22px">±0</text><rect width="1488" height="58" x="56" y="650" fill="#111c30" stroke="#30415a" rx="10"/><path stroke="#9baac0" stroke-linecap="round" stroke-width="2.5" d="M78 669v20m0 5v1"/><text x="104" y="686" class="body">24 reproducible bug-fix tasks in src/core/repoMapBench.ts — a fixture benchmark, not a field measurement.</text></svg>