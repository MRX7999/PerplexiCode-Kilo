  <text x="1482" y="432" text-anchor="middle" class="pill" style="font-size:22px" fill="#5de2e7">−63.3%</text>
  <path d="M56 494h1488" stroke="#1f2b40"/>
  <text x="56" y="550" class="heading">verify pass rate</text>
  <text x="56" y="588" class="body">24 of 24 tasks</text>
  <rect x="480" y="522" width="780" height="36" rx="8" fill="#3a4660"/>
  <text x="1276" y="549" class="label" style="fill:#9baac0">100%</text>
  <rect x="480" y="570" width="780.0" height="36" rx="8" fill="#5de2e7"/>
  <text x="1276.0" y="597" class="label">100%</text>
  <rect x="1420" y="542" width="124" height="44" rx="22" fill="#111c30" stroke="#a4a6ff" stroke-opacity=".6"/>
  <text x="1482" y="572" text-anchor="middle" class="pill" style="font-size:22px" fill="#a4a6ff">±0</text>
  <rect x="56" y="650" width="1488" height="58" rx="10" fill="#111c30" stroke="#30415a"/>
  <path d="M78 669v20m0 5v1" stroke="#9baac0" stroke-width="2.5" stroke-linecap="round"/>
  <text x="104" y="686" class="body">24 reproducible bug-fix tasks in src/core/repoMapBench.ts — a fixture benchmark, not a field measurement.</text>
</svg>
