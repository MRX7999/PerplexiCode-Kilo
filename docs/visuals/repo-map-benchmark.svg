  <rect x="480" y="290" width="181.8181818181818" height="36" rx="8" fill="#5de2e7"/>
  <text x="677.8181818181818" y="317" class="label">1.00</text>
  <rect x="1420" y="262" width="124" height="44" rx="22" fill="#111c30" stroke="#5de2e7" stroke-opacity=".6"/>
  <text x="1482" y="292" text-anchor="middle" class="pill" style="font-size:22px" fill="#5de2e7">−76.7%</text>
  <path d="M56 354h1488" stroke="#1f2b40"/>
  <text x="56" y="410" class="heading">Prompt characters</text>
  <text x="56" y="448" class="body">sent per task</text>
  <rect x="480" y="382" width="780" height="36" rx="8" fill="#3a4660"/>
  <text x="1276" y="409" class="label" style="fill:#9baac0">150,858</text>
  <rect x="480" y="430" width="286.16752177544447" height="36" rx="8" fill="#5de2e7"/>
  <text x="782.1675217754445" y="457" class="label">55,347</text>
