<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740" fill="none" role="img" aria-labelledby="bench-title bench-desc">
  <title id="bench-title">@repo map benchmark, 3.4 baseline versus 3.6</title>
  <desc id="bench-desc">On a reproducible 24-task bug-fix benchmark, read_file calls before the first valid edit dropped from 4.29 to 1.00 (minus 76.7 percent), prompt characters dropped from 150,858 to 55,347 (minus 63.3 percent), and the verify pass rate stayed at 100 percent.</desc>
  <defs>
    <pattern id="bench-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#26344d" stroke-opacity=".26"/>
    </pattern>
    <marker id="bench-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" stroke="#5de2e7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="bench-arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" stroke="#a4a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="bench-arrow3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" stroke="#f5b971" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .overline { font-size:24px; font-weight:600; letter-spacing:3px; fill:#9baac0; }
      .title { font-size:44px; font-weight:650; letter-spacing:-1px; fill:#f3f7fc; }
      .heading { font-size:28px; font-weight:600; fill:#f3f7fc; }
      .body { font-size:24px; fill:#9baac0; }
      .small { font-size:21px; fill:#9baac0; }
      .label { font-size:24px; font-weight:550; fill:#f3f7fc; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size:21px; fill:#5de2e7; }
      .pill { font-size:20px; font-weight:650; letter-spacing:1px; }
      .big { font-size:52px; font-weight:700; letter-spacing:-1px; fill:#5de2e7; }
    </style>
  </defs>
  <rect width="1600" height="740" rx="24" fill="#0b1020"/>
  <rect x="1" y="1" width="1598" height="738" rx="23" stroke="#27344a"/>
  <rect x="1" y="1" width="1598" height="738" rx="23" fill="url(#bench-grid)"/>
  <path d="M1030 1v134c0 29 23 52 52 52h518M1102 1v94c0 29 23 52 52 52h446" stroke="#26344d" stroke-opacity=".55"/>
  <text x="56" y="62" class="overline">BENCHMARK / @REPO MAP · 3.6</text>
  <text x="56" y="120" class="title">Less searching. Same passing tests.</text>
  <path d="M56 152h1488" stroke="#27344a"/>
  <rect x="1140" y="180" width="22" height="22" rx="5" fill="#3a4660"/>
  <text x="1174" y="199" class="small">3.4 baseline</text>
  <rect x="1330" y="180" width="22" height="22" rx="5" fill="#5de2e7"/>
  <text x="1364" y="199" class="small">3.6 with @repo</text>
  <text x="56" y="270" class="heading">read_file calls</text>
  <text x="56" y="308" class="body">before the first edit</text>
  <rect x="480" y="242" width="780" height="36" rx="8" fill="#3a4660"/>
