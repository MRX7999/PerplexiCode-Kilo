name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: PerplexiCode version
      placeholder: "2.0.1"
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options: [Antigravity IDE, VS Code, Cursor, Windsurf, Other]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and mode
      placeholder: "Claude Opus 5.5, Code mode"
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: Steps to reproduce, expected and actual result.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Output → PerplexiCode. Remove cookies, tokens and e-mail addresses before posting.
      render: text
